<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>BIG FISH - Каталог AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      /* Глубокий сумеречный серо-голубой оттенок фона */
      background: #0d131a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      text-align: center;
      padding: 12px 10px 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Логотип уменьшен ровно на 30% (было 190px -> стало ~133px) */
    .brand-logo {
      width: 133px;
      max-width: 65%;
      height: auto;
      display: block;
    }

    /* Верхняя панель выбора моделей */
    .model-nav-container {
      width: 100%;
      max-width: 500px;
      padding: 2px 12px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .model-nav-container::-webkit-scrollbar {
      display: none;
    }
    .model-nav {
      display: flex;
      gap: 8px;
      width: max-content;
      margin: 0 auto;
      align-items: stretch;
    }
    .model-chip {
      background: #141c26;
      border: 1px solid #253346;
      color: #8fa0b8;
      border-radius: 12px;
      padding: 6px 16px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: default;
      user-select: none;
      transition: 0.2s;
    }
    .model-chip .chip-name {
      font-size: 14px;
      font-weight: 700;
      color: inherit;
      line-height: 1.2;
    }
    .model-chip .chip-badge {
      font-size: 9px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-top: 3px;
      line-height: 1;
    }
    .model-chip.active {
      background: #FFF200;
      border-color: #FFF200;
      color: #0d131a;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(255, 242, 0, 0.35);
      cursor: pointer;
    }
    .model-chip.disabled {
      opacity: 0.45;
    }

    .viewer-container {
      width: 100%;
      max-width: 500px;
      height: 44vh;
      position: relative;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      /* Сумеречный серо-голубой градиент подложки вьюпорта */
      background: radial-gradient(circle, #1b2432 0%, #0d131a 75%);
    }

    .ar-launch-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #FFF200;
      color: #0d131a;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(255, 242, 0, 0.4);
      cursor: pointer;
    }

    /* Нижний блок управления сдвинут вверх, учтена системная шторка Safari/iOS */
    .controls-card {
      width: 100%;
      max-width: 500px;
      padding: 4px 20px calc(14px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
      /* Плавный переход с выраженной S-образной кривой скорости (easeInOutCubic) */
      transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1), padding 0.45s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: transform;
    }

    /* Состояние, когда интерфейс проныривает вниз по S-кривой при скрытии нижней панели */
    .controls-card.dock-down {
      transform: translateY(12px);
    }

    .size-selector {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .size-btn {
      flex: 1;
      padding: 10px 0;
      background: #141c26;
      border: 1px solid #253346;
      color: #d1dde8;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .size-btn.active {
      background: #FFF200;
      border-color: #FFF200;
      color: #0d131a;
      box-shadow: 0 0 12px rgba(255, 242, 0, 0.45);
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      justify-items: center;
    }
    .color-swatch {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 2px solid #253346;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-swatch.active {
      border-color: #fff;
      transform: scale(1.1);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.6);
    }

    /* Точные цвета приманок */
    .c1  { background: linear-gradient(135deg, #2EB8EE 50%, #44D937 50%); }
    .c2  { background: linear-gradient(135deg, #5EF389 50%, #FF392E 50%); }
    .c3  { background: linear-gradient(135deg, #38781C 50%, #BDF14F 50%); }
    .c4  { background: linear-gradient(135deg, #FF8636 50%, #D2CD43 50%); }
    .c5  { background: linear-gradient(135deg, #0F140C 50%, #F1F8A3 50%); }
    .c6  { background: linear-gradient(135deg, #113109 50%, #67B42D 50%); }
    .c7  { background: linear-gradient(135deg, #182650 50%, #FB46AF 50%); }
    .c8  { background: linear-gradient(135deg, #106527 50%, #C3BF44 50%); }
    .c9  { background: linear-gradient(135deg, #FF3619 33%, #FFFF52 33%, #FFFF52 66%, #44D937 66%); }
    .c10 { background: linear-gradient(135deg, #940B3C 50%, #C6A945 50%); }
  </style>
</head>
<body>

  <header>
    <img src="logo_bigfish.png" alt="BIG FISH" class="brand-logo">
  </header>

  <div class="model-nav-container">
    <div class="model-nav">
      <div class="model-chip active">
        <span class="chip-name">Rex Rocker</span>
      </div>
      <div class="model-chip disabled">
        <span class="chip-name">Kid Crazy</span>
        <span class="chip-badge">Скоро</span>
      </div>
      <div class="model-chip disabled">
        <span class="chip-name">Valkyrie</span>
        <span class="chip-badge">Скоро</span>
      </div>
      <div class="model-chip disabled">
        <span class="chip-name">ПЛОТВА</span>
        <span class="chip-badge">Скоро</span>
      </div>
    </div>
  </div>

  <div class="viewer-container">
    <model-viewer 
      id="lureViewer"
      src="samets.glb" 
      ios-src="samets_4.usdz"
      alt="Приманка Rex Rocker" 
      ar 
      ar-modes="quick-look scene-viewer webxr" 
      ar-scale="fixed"
      camera-controls 
      autoplay 
      animation-name="*"
      shadow-intensity="1.2"
      exposure="1.1"
      scale="16.67 16.67 16.67">
      
      <button slot="ar-button" class="ar-launch-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        В КАМЕРУ
      </button>
    </model-viewer>
  </div>

  <!-- Блок кнопок без текстовых заголовков -->
  <div class="controls-card" id="controlsCard">
    <div class="size-selector">
      <button class="size-btn" data-scale="8.33" data-usdz="samets_2.usdz">50мм</button>
      <button class="size-btn" data-scale="12.5" data-usdz="samets_3.usdz">75мм</button>
      <button class="size-btn active" data-scale="16.67" data-usdz="samets_4.usdz">100мм</button>
      <button class="size-btn" data-scale="23.33" data-usdz="samets_5_5.usdz">140мм</button>
      <button class="size-btn" data-scale="30.0" data-usdz="samets_7.usdz">180мм</button>
    </div>

    <div class="color-grid" id="colorGrid">
      <div class="color-swatch c1 active" data-variant="samets_color_01"></div>
      <div class="color-swatch c2" data-variant="samets_color_02"></div>
      <div class="color-swatch c3" data-variant="samets_color_03"></div>
      <div class="color-swatch c4" data-variant="samets_color_04"></div>
      <div class="color-swatch c5" data-variant="samets_color_05"></div>
      <div class="color-swatch c6" data-variant="samets_color_06"></div>
      <div class="color-swatch c7" data-variant="samets_color_07"></div>
      <div class="color-swatch c8" data-variant="samets_color_08"></div>
      <div class="color-swatch c9" data-variant="samets_color_09"></div>
      <div class="color-swatch c10" data-variant="samets_color_10"></div>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('lureViewer');
    const sizeBtns = document.querySelectorAll('.size-btn');
    const colorSwatches = document.querySelectorAll('.color-swatch');
    const controlsCard = document.getElementById('controlsCard');

    // Отслеживание скрытия панели Safari (динамическое изменение высоты окна)
    let initialHeight = window.innerHeight;
    window.addEventListener('resize', () => {
      if (window.innerHeight > initialHeight + 30) {
        controlsCard.classList.add('dock-down');
      } else {
        controlsCard.classList.remove('dock-down');
      }
    });

    sizeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        sizeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const s = btn.getAttribute('data-scale');
        viewer.scale = `${s} ${s} ${s}`;

        const usdzFile = btn.getAttribute('data-usdz');
        if (usdzFile) {
          viewer.setAttribute('ios-src', usdzFile);
        }
      });
    });

    colorSwatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        colorSwatches.forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        const variantName = swatch.getAttribute('data-variant');
        viewer.variantName = variantName;
      });
    });

    viewer.addEventListener('load', () => {
      viewer.scale = "16.67 16.67 16.67";
      viewer.setAttribute('ios-src', 'samets_4.usdz');
      if (viewer.availableAnimations && viewer.availableAnimations.length > 0) {
        viewer.play({ repetitions: Infinity });
      }
    });
  </script>
</body>
</html>
