<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>BIG FISH - Каталог AR</title>

  <!-- Иконка сайта -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

  <!-- Цвет статус-бара под фон -->
  <meta name="theme-color" content="#090119">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,600..800&display=swap" rel="stylesheet">

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    :root {
      --safari-top-color: #090119;
      --bg-gradient: 
        radial-gradient(circle at 10% 60%, #5e00db 0%, rgba(94, 0, 219, 0.4) 40%, transparent 100%),
        radial-gradient(circle at 90% 90%, #22004d 0%, transparent 50%),
        linear-gradient(155deg, #080119 0%, #0d0026 25%, #150438 50%, #1a0247 75%, #080119 100%);
      --bg-base: #090119;
      --text-color: #ffffff;
      
      /* Цвета нового UI */
      --chip-bg: #291147;
      --chip-text: #ffffff;
      --accent-color: #FFF200;
      --accent-contrast: #111317;
      --shadow-color: rgba(255, 242, 0, 0.4);

      /* Скругления из Figma */
      --radius-element: 24px;
      --radius-color: 48px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      background-color: var(--bg-base);
      background-image: var(--bg-gradient);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: var(--text-color);
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-variation-settings: 'wdth' 85;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Верхняя зона интерфейса */
    .top-header-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: max(14px, env(safe-area-inset-top)) 16px 8px 16px;
      z-index: 20;
      flex-shrink: 0;
    }

    /* Верхний ряд: Логотип слева + Кнопка КАМЕРА справа */
    .header-top-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .brand-link:active {
      transform: scale(0.96);
      opacity: 0.85;
    }
    .brand-logo {
      height: 40px;
      width: auto;
      max-width: 160px;
      object-fit: contain;
      display: block;
    }

    /* Кнопка КАМЕРА */
    .ar-launch-btn {
      height: 42px;
      background: var(--accent-color);
      color: var(--accent-contrast);
      border: none;
      padding: 0 16px;
      border-radius: var(--radius-element);
      font-family: inherit;
      font-variation-settings: 'wdth' 85;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--shadow-color);
      cursor: pointer;
      transition: transform 0.15s ease;
      white-space: nowrap;
    }
    .ar-launch-btn:active {
      transform: scale(0.95);
    }
    .ar-launch-btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.2;
      flex-shrink: 0;
    }

    /* Ряд моделей */
    .model-nav {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: space-between;
      align-items: center;
    }

    .model-chip {
      flex: 1 1 0;
      background: var(--chip-bg);
      border: none;
      color: var(--chip-text);
      border-radius: var(--radius-element);
      height: 44px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: 0.2s ease;
    }
    .model-chip .chip-name {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
    }
    .model-chip.active {
      background: var(--accent-color);
      color: var(--accent-contrast);
      box-shadow: 0 4px 14px var(--shadow-color);
    }

    /* Центральная 3D-сцена */
    .viewer-container {
      width: 100%;
      max-width: 500px;
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      background: transparent !important;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent !important;
      background-color: transparent !important;
      background: transparent !important;
    }
    model-viewer::part(default-ar-button) {
      display: none !important;
    }

    /* Нижняя панель */
    .controls-card {
      width: 100%;
      max-width: 440px;
      flex-shrink: 0;
      margin-top: auto;
      padding: 8px 16px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.35s cubic-bezier(0.65, 0, 0.35, 1);
      z-index: 10;
    }

    /* Размеры */
    .size-selector {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: space-between;
    }
    .size-btn {
      flex: 1 1 0;
      height: 44px;
      background: var(--chip-bg);
      border: none;
      color: var(--chip-text);
      border-radius: var(--radius-element);
      font-family: inherit;
      font-variation-settings: 'wdth' 85;
      font-weight: 700;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s ease;
      white-space: nowrap;
    }
    .size-btn.active {
      background: var(--accent-color);
      color: var(--accent-contrast);
      box-shadow: 0 4px 14px var(--shadow-color);
    }

    /* Сетка цветов 5x2 */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      width: 100%;
    }
    .color-swatch {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-color);
      border: none;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .color-swatch.active {
      outline: 3px solid var(--accent-color);
      outline-offset: -2px;
      transform: scale(1.05);
      box-shadow: 0 0 16px var(--shadow-color);
    }

    /* Адаптация под горизонтальный экран */
    @media (orientation: landscape) and (max-height: 550px) {
      body {
        flex-direction: row;
        justify-content: space-between;
        align-items: stretch;
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }

      .viewer-container {
        flex: 1 1 auto;
        max-width: none;
        height: 100%;
        order: 1;
      }

      .top-header-wrapper {
        width: 340px;
        max-width: 44%;
        height: 100%;
        order: 2;
        padding: max(10px, env(safe-area-inset-top)) 0 max(8px, env(safe-area-inset-bottom)) 8px;
        background: transparent;
        overflow-y: auto;
        scrollbar-width: none;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }
      .top-header-wrapper::-webkit-scrollbar {
        display: none;
      }

      .brand-logo {
        height: 32px;
      }
      .ar-launch-btn {
        height: 34px;
        padding: 0 12px;
        font-size: 11px;
      }
      .model-chip {
        height: 36px;
      }
      .model-chip .chip-name {
        font-size: 10px;
      }

      .controls-card {
        max-width: none;
        padding: 0;
        margin-top: auto;
        gap: 8px;
        width: 100%;
      }
      .size-btn {
        height: 34px;
        font-size: 10px;
      }
      .color-grid {
        gap: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- Верхняя панель: Логотип + КАМЕРА + Список моделей -->
  <div class="top-header-wrapper" id="topWrapper">
    <div class="header-top-row">
      <a href="https://taplink.cc/bigfish" target="_blank" rel="noopener noreferrer" class="brand-link" aria-label="Перейти на Taplink BIG FISH">
        <img src="logo_bigfish.png" alt="BIG FISH" class="brand-logo">
      </a>
      <button id="triggerArBtn" class="ar-launch-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        КАМЕРА
      </button>
    </div>

    <div class="model-nav" id="modelNav">
      <button class="model-chip active" data-model="rex">
        <span class="chip-name">REX ROCKER</span>
      </button>
      <button class="model-chip" data-model="dangerous">
        <span class="chip-name">DANGEROUS</span>
      </button>
      <button class="model-chip" data-model="kidcrazy">
        <span class="chip-name">KID CRAZY</span>
      </button>
      <button class="model-chip" data-model="vixenvox">
        <span class="chip-name">VALKYRIE</span>
      </button>
    </div>
  </div>

  <!-- 3D AR Viewer -->
  <div class="viewer-container">
    <model-viewer 
      id="lureViewer"
      src="samets.glb" 
      ios-src="samets_4.usdz"
      alt="Рыболовная приманка BIG FISH" 
      ar 
      ar-modes="quick-look scene-viewer webxr" 
      ar-scale="fixed"
      camera-controls 
      autoplay 
      animation-name="*"
      environment-image="neutral"
      tone-mapping="neutral"
      shadow-intensity="0.8"
      shadow-softness="0.5"
      exposure="1.0"
      zoom-sensitivity="0.1"
      interpolation-decay="200"
      min-camera-orbit="auto auto 0.05m"
      max-camera-orbit="Infinity 180deg 6m"
      camera-target="0.14m 0.18m 0m"
      camera-orbit="0deg 80deg 4m"
      field-of-view="auto"
      scale="16.67 16.67 16.67">
    </model-viewer>
  </div>

  <!-- Нижняя панель: Размеры и Цвета -->
  <div class="controls-card" id="controlsCard">
    <div class="size-selector" id="sizeSelector"></div>
    <div class="color-grid" id="colorGrid"></div>
  </div>

  <script>
    const viewer = document.getElementById('lureViewer');
    const modelChips = document.querySelectorAll('.model-chip');
    const sizeSelector = document.getElementById('sizeSelector');
    const colorGrid = document.getElementById('colorGrid');
    const triggerArBtn = document.getElementById('triggerArBtn');
    const topWrapper = document.getElementById('topWrapper');
    const controlsCard = document.getElementById('controlsCard');

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // Запуск AR: нативный Quick Look для iOS или SceneViewer / WebXR для Android
    triggerArBtn.addEventListener('click', () => {
      const iosSrc = viewer.getAttribute('ios-src');
      if (isIOS && iosSrc) {
        const absoluteUrl = new URL(iosSrc, window.location.href).href;
        const anchor = document.createElement('a');
        anchor.setAttribute('rel', 'ar');
        anchor.setAttribute('href', absoluteUrl);
        anchor.appendChild(document.createElement('img'));
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
      } else {
        if (viewer.canActivateAR) {
          viewer.activateAR();
        }
      }
    });

    function handleOrientationLayout() {
      const isLandscape = window.matchMedia('(orientation: landscape) and (max-height: 550px)').matches;
      if (isLandscape) {
        if (!topWrapper.contains(controlsCard)) {
          topWrapper.appendChild(controlsCard);
        }
      } else {
        if (topWrapper.contains(controlsCard)) {
          document.body.appendChild(controlsCard);
        }
      }

      const data = catalogData[currentModelKey];
      if (data) {
        applyZoom(data, false);
      }
    }

    window.addEventListener('resize', handleOrientationLayout);
    window.addEventListener('orientationchange', handleOrientationLayout);

    const catalogData = {
      rex: {
        glb: "samets.glb",
        defaultIos: "samets_4.usdz",
        defaultScale: "16.67 16.67 16.67",
        cameraTarget: "0.14m 0.18m 0m",
        orbit: "0deg 80deg 4m",
        fov: "auto",
        sizes: [
          { name: "50 MM", scale: "8.33", usdz: "samets_2.usdz" },
          { name: "75 MM", scale: "12.5", usdz: "samets_3.usdz" },
          { name: "100 MM", scale: "16.67", usdz: "samets_4.usdz", default: true },
          { name: "140 MM", scale: "23.33", usdz: "samets_5_5.usdz" },
          { name: "180 MM", scale: "30.0", usdz: "samets_7.usdz" }
        ],
        colors: [
          { variant: "samets_color_01", gradient: "linear-gradient(135deg, #2EB8EE 50%, #44D937 50%)" },
          { variant: "samets_color_02", gradient: "linear-gradient(135deg, #5EF389 50%, #FF392E 50%)" },
          { variant: "samets_color_03", gradient: "linear-gradient(135deg, #38781C 50%, #BDF14F 50%)" },
          { variant: "samets_color_04", gradient: "linear-gradient(135deg, #FF8636 50%, #D2CD43 50%)" },
          { variant: "samets_color_05", gradient: "linear-gradient(135deg, #0F140C 50%, #F1F8A3 50%)" },
          { variant: "samets_color_06", gradient: "linear-gradient(135deg, #113109 50%, #67B42D 50%)" },
          { variant: "samets_color_07", gradient: "linear-gradient(135deg, #182650 50%, #FB46AF 50%)" },
          { variant: "samets_color_08", gradient: "linear-gradient(135deg, #106527 50%, #C3BF44 50%)" },
          { variant: "samets_color_09", gradient: "linear-gradient(135deg, #FF3619 33%, #FFFF52 33%, #FFFF52 66%, #44D937 66%)" },
          { variant: "samets_color_10", gradient: "linear-gradient(135deg, #940B3C 50%, #C6A945 50%)" }
        ]
      },
      dangerous: {
        glb: "dangerous.glb",
        defaultIos: "dangerous_115.usdz",
        defaultScale: "1 1 1",
        cameraTarget: "auto auto auto",
        orbit: "0deg 80deg 0.32m",
        fov: "auto",
        sizes: [
          { name: "75 MM", scale: "0.652", usdz: "dangerous_75.usdz" },
          { name: "115 MM", scale: "1.0", usdz: "dangerous_115.usdz", default: true },
          { name: "200 MM", scale: "1.739", usdz: "dangerous_200.usdz" }
        ],
        colors: [
          { variant: "dangerous_color_01", gradient: "linear-gradient(135deg, #2EB8EE 50%, #44D937 50%)" },
          { variant: "dangerous_color_02", gradient: "linear-gradient(135deg, #182650 50%, #FB46AF 50%)" },
          { variant: "dangerous_color_03", gradient: "linear-gradient(135deg, #38781C 50%, #BDF14F 50%)" },
          { variant: "dangerous_color_04", gradient: "linear-gradient(135deg, #FF8636 50%, #D2CD43 50%)" },
          { variant: "dangerous_color_05", gradient: "linear-gradient(135deg, #0F140C 50%, #F1F8A3 50%)" },
          { variant: "dangerous_color_06", gradient: "linear-gradient(135deg, #113109 50%, #67B42D 50%)" },
          { variant: "dangerous_color_07", gradient: "linear-gradient(135deg, #FF3619 33%, #FFFF52 33%, #FFFF52 66%, #44D937 66%)" },
          { variant: "dangerous_color_08", gradient: "linear-gradient(135deg, #520E78 0%, #520E78 100%)" },
          { variant: "dangerous_color_09", gradient: "linear-gradient(135deg, #FF392E 50%, #5C782D 50%)" },
          { variant: "dangerous_color_10", gradient: "linear-gradient(135deg, #5D4498 50%, #EB613A 50%)" }
        ]
      },
      kidcrazy: {
        glb: "kidcrazy.glb",
        defaultIos: "kidcrazy.usdz",
        defaultScale: "1 1 1",
        cameraTarget: "auto auto auto",
        orbit: "0deg 80deg 0.25m",
        fov: "auto",
        sizes: [
          { name: "120 MM", scale: "1.0", usdz: "kidcrazy.usdz", default: true }
        ],
        colors: [
          { variant: "kidcrazy_color_01", gradient: "linear-gradient(135deg, #2EB8EE 50%, #44D937 50%)" },
          { variant: "kidcrazy_color_02", gradient: "linear-gradient(135deg, #2A6040 50%, #D15110 50%)" },
          { variant: "kidcrazy_color_03", gradient: "linear-gradient(135deg, #C3DF68 50%, #B7A71D 50%)" },
          { variant: "kidcrazy_color_04", gradient: "linear-gradient(135deg, #FF8636 50%, #D2CD43 50%)" },
          { variant: "kidcrazy_color_05", gradient: "linear-gradient(135deg, #0F140C 50%, #F1F8A3 50%)" },
          { variant: "kidcrazy_color_06", gradient: "linear-gradient(135deg, #113109 50%, #67B42D 50%)" },
          { variant: "kidcrazy_color_07", gradient: "linear-gradient(135deg, #106527 50%, #C3BF44 50%)" }
        ]
      },
      vixenvox: {
        glb: "valkyrie.glb",
        defaultIos: "Valkyrie.usdz",
        defaultScale: "1 1 1",
        cameraTarget: "auto auto auto",
        orbit: "0deg 80deg 0.425m",
        fov: "auto",
        sizes: [
          { name: "200 MM", scale: "1.0", usdz: "Valkyrie.usdz", default: true }
        ],
        colors: [
          { variant: "valkyrie_color_01", gradient: "linear-gradient(135deg, #2EB8EE 42%, #FFFFFF 42%, #FFFFFF 58%, #C3EB59 58%)" },
          { variant: "valkyrie_color_02", gradient: "linear-gradient(135deg, #064E0A 33%, #FFFF52 33%, #FFFF52 66%, #FF3619 66%)" },
          { variant: "valkyrie_color_03", gradient: "linear-gradient(135deg, #2D2D2C 33%, #4CBE65 33%, #4CBE65 66%, #C6A945 66%)" },
          { variant: "valkyrie_color_04", gradient: "linear-gradient(135deg, #FF8636 50%, #D2CD43 50%)" },
          { variant: "valkyrie_color_05", gradient: "linear-gradient(135deg, #44D937 33%, #FFFF52 33%, #FFFF52 66%, #FF3619 66%)" },
          { variant: "valkyrie_color_06", gradient: "linear-gradient(135deg, #940B3C 50%, #C6A945 50%)" },
          { variant: "valkyrie_color_07", gradient: "linear-gradient(135deg, #87676D 42%, #C574BD 42%, #C574BD 58%, #C8C6D3 58%)" }
        ]
      }
    };

    let currentModelKey = 'rex';

    function applyZoom(data, forceReset = false) {
      if (forceReset) {
        viewer.setAttribute('camera-target', data.cameraTarget || 'auto auto auto');
        viewer.setAttribute('camera-orbit', data.orbit || '0deg 80deg auto');
        viewer.setAttribute('field-of-view', data.fov || 'auto');
      } else {
        if (!viewer.getAttribute('camera-target')) viewer.setAttribute('camera-target', data.cameraTarget || 'auto auto auto');
        if (!viewer.getAttribute('camera-orbit')) viewer.setAttribute('camera-orbit', data.orbit || '0deg 80deg auto');
      }

      if (viewer.jumpCameraToGoal) {
        viewer.jumpCameraToGoal();
      }
    }

    function renderUI(modelKey) {
      const data = catalogData[modelKey];
      currentModelKey = modelKey;

      viewer.src = data.glb;
      viewer.setAttribute('ios-src', data.defaultIos);
      viewer.scale = data.defaultScale;
      applyZoom(data, true);

      // Генерация кнопок размеров
      sizeSelector.innerHTML = '';
      data.sizes.forEach(sz => {
        const btn = document.createElement('button');
        btn.className = `size-btn ${sz.default ? 'active' : ''}`;
        btn.textContent = sz.name;
        btn.setAttribute('data-scale', sz.scale);
        btn.setAttribute('data-usdz', sz.usdz);

        btn.addEventListener('click', () => {
          document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const s = btn.getAttribute('data-scale');
          
          viewer.scale = `${s} ${s} ${s}`;

          const u = btn.getAttribute('data-usdz');
          if (u) viewer.setAttribute('ios-src', u);
          
          applyZoom(data, true);
        });
        sizeSelector.appendChild(btn);
      });

      // Генерация палитры цветов
      colorGrid.innerHTML = '';
      data.colors.forEach((c, index) => {
        const swatch = document.createElement('div');
        swatch.className = `color-swatch ${index === 0 ? 'active' : ''}`;
        swatch.style.background = c.gradient;
        swatch.setAttribute('data-variant', c.variant);

        swatch.addEventListener('click', () => {
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
          viewer.variantName = c.variant;
        });
        colorGrid.appendChild(swatch);
      });
    }

    // Слушатели переключения моделей
    modelChips.forEach(chip => {
      chip.addEventListener('click', () => {
        modelChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        const mKey = chip.getAttribute('data-model');
        renderUI(mKey);
      });
    });

    viewer.addEventListener('load', () => {
      const data = catalogData[currentModelKey];
      applyZoom(data, false);

      if (viewer.availableAnimations && viewer.availableAnimations.length > 0) {
        viewer.play({ repetitions: Infinity });
      }
      const activeColor = document.querySelector('.color-swatch.active');
      if (activeColor) {
        viewer.variantName = activeColor.getAttribute('data-variant');
      }
    });

    renderUI('rex');
    handleOrientationLayout();
  </script>
</body>
</html>
