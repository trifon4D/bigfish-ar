<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>BIG FISH - Каталог AR</title>

  <!-- Подключение Open Sans с вариативной шириной wdth -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&display=swap" rel="stylesheet">

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      background: #111317;
      color: #fff;
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-variation-settings: 'wdth' 77;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    header {
      width: 100%;
      text-align: center;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .brand-logo {
      width: 130px;
      max-width: 60%;
      height: auto;
      display: block;
    }

    /* Верхняя панель моделей: сжата по ширине к центру */
    .model-nav-container {
      width: 100%;
      max-width: 340px; /* Сужение всей группы к центру */
      margin: 12px auto 0 auto;
      padding: 0 4px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .model-nav-container::-webkit-scrollbar {
      display: none;
    }
    .model-nav {
      display: flex;
      gap: 5px; /* Плотный зазор между плашками */
      width: 100%;
      justify-content: center;
      align-items: stretch;
    }
    .model-chip {
      background: #1b1e24;
      border: 1px solid #2b303a;
      color: #8f96a3;
      border-radius: 10px;
      padding: 6px 8px; /* Уменьшенные боковые отступы для компактности */
      min-height: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 1 0; /* Равномерное заполнение узкого центра */
      text-align: center;
      cursor: default;
      user-select: none;
      transition: 0.2s;
    }
    .model-chip .chip-name {
      font-size: 11.5px;
      font-weight: 700;
      color: inherit;
      line-height: 1.15;
      white-space: nowrap;
    }
    .model-chip .chip-badge {
      font-size: 7.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-top: 2px;
      line-height: 1;
      white-space: nowrap;
    }
    .model-chip.active {
      background: #FFF200;
      border-color: #FFF200;
      color: #111317;
      font-weight: 800;
      box-shadow: 0 3px 12px rgba(255, 242, 0, 0.35);
      cursor: pointer;
    }
    .model-chip.disabled {
      opacity: 0.45;
    }

    /* Центральная 3D-сцена */
    .viewer-container {
      width: 100%;
      max-width: 500px;
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      background: radial-gradient(circle, #20242c 0%, #111317 75%);
    }

    .ar-launch-btn {
      position: absolute;
      top: 10px;
      right: 16px;
      background: #FFF200;
      color: #111317;
      border: none;
      padding: 8px 14px;
      border-radius: 18px;
      font-family: 'Open Sans', sans-serif;
      font-variation-settings: 'wdth' 77;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(255, 242, 0, 0.4);
      cursor: pointer;
      z-index: 10;
    }

    /* Нижняя панель переключателей */
    .controls-card {
      width: 100%;
      max-width: 500px;
      flex-shrink: 0;
      margin-top: auto;
      padding: 6px 16px max(12px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.35s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* Сетка размеров строго по вертикалям цветов */
    .size-selector {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      width: 100%;
    }
    .size-btn {
      width: 100%;
      height: 38px;
      background: #1b1e24;
      border: 1px solid #2b303a;
      color: #cfd4dc;
      border-radius: 8px;
      font-family: 'Open Sans', sans-serif;
      font-variation-settings: 'wdth' 77;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .size-btn.active {
      background: #FFF200;
      border-color: #FFF200;
      color: #111317;
      box-shadow: 0 0 12px rgba(255, 242, 0, 0.45);
    }

    /* Сетка цветов */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      width: 100%;
    }
    .color-swatch {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border: 2px solid #2b303a;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-swatch.active {
      border-color: #fff;
      transform: scale(1.06);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.6);
    }

    /* Цвета приманок */
    .c1  { background: linear-gradient(135deg, #2EB8EE 50%, #44D937 50%); }
    .c2  { background: linear-gradient(135deg, #5EF389 50%, #FF392E 50%); }
    .c3  { background: linear-gradient(135deg, #38781C 50%, #BDF14F 50%); }
    .c4  { background: linear-gradient(135deg, #FF8636 50%, #D2CD43 50%); }
    .c5  { background: linear-gradient(135deg, #0F140C 50%, #F1F8A3 50%); }
    .c6  { background: linear-gradient(135deg, #113109 50%, #67B42D 50%); }
    .c7  { background: linear-gradient(135deg, #182650 50%, #FB46AF 50%); }
    .c8  { background: linear-gradient(135deg, #106527 50%, #C3BF44 50%); }
    .c9  { background: linear-gradient(135deg, #FF3619 33%, #FFFF52 33%, #FFFF52 66%, #44D937 66%); }
    .c10 { background: linear-gradient(135deg, #940B3C 50%, #C6A945 50%); }
  </style>
</head>
<body>

  <header>
    <img src="logo_bigfish.png" alt="BIG FISH" class="brand-logo">
  </header>

  <div class="model-nav-container">
    <div class="model-nav">
      <div class="model-chip active">
        <span class="chip-name">Rex Rocker</span>
      </div>
      <div class="model-chip disabled">
        <span class="chip-name">Kid Crazy</span>
        <span class="chip-badge">Скоро</span>
      </div>
      <div class="model-chip disabled">
        <span class="chip-name">Valkyrie</span>
        <span class="chip-badge">Скоро</span>
      </div>
      <div class="model-chip disabled">
        <span class="chip-name">ПЛОТВА</span>
        <span class="chip-badge">Скоро</span>
      </div>
    </div>
  </div>

  <div class="viewer-container">
    <model-viewer 
      id="lureViewer"
      src="samets.glb" 
      ios-src="samets_4.usdz"
      alt="Приманка Rex Rocker" 
      ar 
      ar-modes="quick-look scene-viewer webxr" 
      ar-scale="fixed"
      camera-controls 
      autoplay 
      animation-name="*"
      shadow-intensity="1.2"
      exposure="1.1"
      scale="16.67 16.67 16.67">
      
      <button slot="ar-button" class="ar-launch-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        В КАМЕРУ
      </button>
    </model-viewer>
  </div>

  <div class="controls-card">
    <div class="size-selector">
      <button class="size-btn" data-scale="8.33" data-usdz="samets_2.usdz">50мм</button>
      <button class="size-btn" data-scale="12.5" data-usdz="samets_3.usdz">75мм</button>
      <button class="size-btn active" data-scale="16.67" data-usdz="samets_4.usdz">100мм</button>
      <button class="size-btn" data-scale="23.33" data-usdz="samets_5_5.usdz">140мм</button>
      <button class="size-btn" data-scale="30.0" data-usdz="samets_7.usdz">180мм</button>
    </div>

    <div class="color-grid" id="colorGrid">
      <div class="color-swatch c1 active" data-variant="samets_color_01"></div>
      <div class="color-swatch c2" data-variant="samets_color_02"></div>
      <div class="color-swatch c3" data-variant="samets_color_03"></div>
      <div class="color-swatch c4" data-variant="samets_color_04"></div>
      <div class="color-swatch c5" data-variant="samets_color_05"></div>
      <div class="color-swatch c6" data-variant="samets_color_06"></div>
      <div class="color-swatch c7" data-variant="samets_color_07"></div>
      <div class="color-swatch c8" data-variant="samets_color_08"></div>
      <div class="color-swatch c9" data-variant="samets_color_09"></div>
      <div class="color-swatch c10" data-variant="samets_color_10"></div>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('lureViewer');
    const sizeBtns = document.querySelectorAll('.size-btn');
    const colorSwatches = document.querySelectorAll('.color-swatch');

    sizeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        sizeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const s = btn.getAttribute('data-scale');
        viewer.scale = `${s} ${s} ${s}`;

        const usdzFile = btn.getAttribute('data-usdz');
        if (usdzFile) {
          viewer.setAttribute('ios-src', usdzFile);
        }
      });
    });

    colorSwatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        colorSwatches.forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        const variantName = swatch.getAttribute('data-variant');
        viewer.variantName = variantName;
      });
    });

    viewer.addEventListener('load', () => {
      viewer.scale = "16.67 16.67 16.67";
      viewer.setAttribute('ios-src', 'samets_4.usdz');
      if (viewer.availableAnimations && viewer.availableAnimations.length > 0) {
        viewer.play({ repetitions: Infinity });
      }
    });
  </script>
</body>
</html>
