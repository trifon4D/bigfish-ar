<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>BIG FISH - Каталог AR</title>

  <!-- Цвета статус-бара Safari в цвет монолитного старта шапки -->
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111317">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eaedf2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&display=swap" rel="stylesheet">

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    :root {
      --safari-top-color: #111317;
      --bg-gradient: radial-gradient(ellipse at 50% 45%, #232832 0%, #111317 75%);
      --bg-base: #111317;
      --text-color: #ffffff;
      --chip-bg: #1b1e24;
      --chip-border: #2b303a;
      --chip-text: #8f96a3;
      --accent-color: #FFF200;
      --accent-contrast: #111317;
      --shadow-color: rgba(255, 242, 0, 0.35);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --safari-top-color: #eaedf2;
        --bg-gradient: radial-gradient(ellipse at 50% 45%, #f4f6f9 0%, #d8dde6 75%);
        --bg-base: #eaedf2;
        --text-color: #121417;
        --chip-bg: #ffffff;
        --chip-border: #cfd5e0;
        --chip-text: #4a5260;
        --accent-color: #FFF200;
        --accent-contrast: #111317;
        --shadow-color: rgba(212, 201, 0, 0.45);
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      background-color: var(--safari-top-color);
      background-image: var(--bg-gradient);
      color: var(--text-color);
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-variation-settings: 'wdth' 77;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* Блок шапки и навигации с мягким градиентом от края Safari до низа плашек */
    .top-header-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(to bottom, 
        var(--safari-top-color) 0%, 
        var(--safari-top-color) 45%, 
        transparent 100%
      );
      padding-top: max(10px, env(safe-area-inset-top));
      padding-bottom: 8px;
      z-index: 20;
      flex-shrink: 0;
    }

    header {
      width: 100%;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 4px;
    }
    .brand-logo {
      width: 117px;
      max-width: 55%;
      height: auto;
      display: block;
    }

    /* Верхняя панель моделей */
    .model-nav-container {
      width: 100%;
      max-width: 500px;
      margin: 6px auto 0 auto;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .model-nav {
      display: flex;
      gap: 6px;
      width: 100%;
      justify-content: center;
      align-items: flex-start;
    }
    .nav-col {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      position: relative;
    }

    .model-chip {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: var(--chip-text);
      border-radius: 10px;
      padding: 6px 4px;
      min-height: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: 0.2s;
    }
    .model-chip .chip-name {
      font-size: 11px;
      font-weight: 700;
      color: inherit;
      line-height: 1.15;
      white-space: nowrap;
    }
    .model-chip.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: var(--accent-contrast);
      font-weight: 800;
      box-shadow: 0 3px 12px var(--shadow-color);
    }

    /* Кнопка "в камеру" */
    .ar-slot-wrapper {
      width: 100%;
      margin-top: 8px;
    }
    .ar-launch-btn {
      width: 100%;
      height: 30px;
      background: var(--accent-color);
      color: var(--accent-contrast);
      border: none;
      padding: 0 4px;
      border-radius: 15px;
      font-family: 'Open Sans', sans-serif;
      font-variation-settings: 'wdth' 77;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      text-transform: lowercase;
      letter-spacing: normal;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 3px 12px var(--shadow-color);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .ar-launch-btn:active {
      transform: scale(0.95);
    }
    .ar-launch-btn svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    /* Центральная 3D-сцена */
    .viewer-container {
      width: 100%;
      max-width: 500px;
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      background: transparent;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      background: transparent;
    }

    model-viewer::part(default-ar-button) {
      display: none !important;
    }

    /* Нижняя панель */
    .controls-card {
      width: 100%;
      max-width: 500px;
      flex-shrink: 0;
      margin-top: auto;
      padding: 6px 16px max(12px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.35s cubic-bezier(0.65, 0, 0.35, 1);
      z-index: 10;
    }

    .size-selector {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }
    .size-btn {
      flex: 1;
      max-width: 140px;
      height: 38px;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: var(--chip-text);
      border-radius: 8px;
      font-family: 'Open Sans', sans-serif;
      font-variation-settings: 'wdth' 77;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .size-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: var(--accent-contrast);
      box-shadow: 0 0 12px var(--shadow-color);
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      width: 100%;
    }
    .color-swatch {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border: 2px solid var(--chip-border);
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-swatch.active {
      border-color: #fff;
      transform: scale(1.06);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.6);
    }
    @media (prefers-color-scheme: light) {
      .color-swatch.active {
        border-color: #111317;
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.35);
      }
    }
  </style>
</head>
<body>

  <div class="top-header-wrapper">
    <header>
      <img src="logo_bigfish.png" alt="BIG FISH" class="brand-logo">
    </header>

    <div class="model-nav-container">
      <div class="model-nav">
        <!-- 1. Rex Rocker -->
        <div class="nav-col">
          <div class="model-chip active" data-model="rex">
            <span class="chip-name">Rex Rocker</span>
          </div>
        </div>
        <!-- 2. Dangerous -->
        <div class="nav-col">
          <div class="model-chip" data-model="dangerous">
            <span class="chip-name">Dangerous</span>
          </div>
        </div>
        <!-- 3. Kid Crazy -->
        <div class="nav-col">
          <div class="model-chip" data-model="kidcrazy">
            <span class="chip-name">Kid Crazy</span>
          </div>
        </div>
        <!-- 4. Valkyrie -->
        <div class="nav-col">
          <div class="model-chip" data-model="valkyrie">
            <span class="chip-name">Valkyrie</span>
          </div>
          <div class="ar-slot-wrapper">
            <button id="triggerArBtn" class="ar-launch-btn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
              в камеру
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="viewer-container">
    <model-viewer 
      id="lureViewer"
      src="samets.glb" 
      ios-src="samets_4.usdz"
      alt="Рыболовная приманка BIG FISH" 
      ar 
      ar-modes="quick-look scene-viewer webxr" 
      ar-scale="fixed"
      camera-controls 
      autoplay 
      animation-name="*"
      environment-image="neutral"
      tone-mapping="neutral"
      shadow-intensity="0.8"
      shadow-softness="0.5"
      exposure="1.0"
      min-camera-orbit="auto auto 0.1m"
      max-camera-orbit="Infinity 180deg 50m"
      camera-target="0.14m 0.18m 0m"
      camera-orbit="0deg 80deg 4m"
      field-of-view="auto"
      scale="16.67 16.67 16.67">
    </model-viewer>
  </div>

  <div class="controls-card">
    <div class="size-selector" id="sizeSelector"></div>
    <div class="color-grid" id="colorGrid"></div>
  </div>

  <script>
    const viewer = document.getElementById('lureViewer');
    const modelChips = document.querySelectorAll('.model-chip');
    const sizeSelector = document.getElementById('sizeSelector');
    const colorGrid = document.getElementById('colorGrid');
    const triggerArBtn = document.getElementById('triggerArBtn');

    triggerArBtn.addEventListener('click', () => {
      if (viewer.canActivateAR) {
        viewer.activateAR();
      }
    });

    const catalogData = {
      rex: {
        glb: "samets.glb",
        defaultIos: "samets_4.usdz",
        defaultScale: "16.67 16.67 16.67",
        cameraTarget: "0.14m 0.18m 0m",
        orbit: "0deg 80deg 4m",
        fov: "auto",
        sizes: [
          { name: "50мм", scale: "8.33", usdz: "samets_2.usdz" },
          { name: "75мм", scale: "12.5", usdz: "samets_3.usdz" },
          { name: "100мм", scale: "16.67", usdz: "samets_4.usdz", default: true },
          { name: "140мм", scale: "23.33", usdz: "samets_5_5.usdz" },
          { name: "180мм", scale: "30.0", usdz: "samets_7.usdz" }
        ],
        colors: [
          { variant: "samets_color_01", gradient: "linear-gradient(135deg, #2EB8EE 50%, #44D937 50%)" },
          { variant: "samets_color_02", gradient: "linear-gradient(135deg, #5EF389 50%, #FF392E 50%)" },
          { variant: "samets_color_03", gradient: "linear-gradient(135deg, #38781C 50%, #BDF14F 50%)" },
          { variant: "samets_color_04", gradient: "linear-gradient(135deg, #FF8636 50%, #D2CD43 50%)" },
          { variant: "samets_color_05", gradient: "linear-gradient(135deg, #0F140C 50%, #F1F8A3 50%)" },
          { variant: "samets_color_06", gradient: "linear-gradient(135deg, #113109 50%, #67B42D 50%)" },
          { variant: "samets_color_07", gradient: "linear-gradient(135deg, #182650 50%, #FB46AF 50%)" },
          { variant: "samets_color_08", gradient: "linear-gradient(135deg, #106527 50%, #C3BF44 50%)" },
          { variant: "samets_color_09", gradient: "linear-gradient(135deg, #FF3619 33%, #FFFF52 33%, #FFFF52 66%, #44D937 66%)" },
          { variant: "samets_color_10", gradient: "linear-gradient(135deg, #940B3C 50%, #C6A945 50%)" }
        ]
      },
      dangerous: {
        glb: "dangerous.glb",
        defaultIos: "dangerous_115.usdz",
        defaultScale: "1 1 1",
        cameraTarget: "auto auto auto",
        orbit: "0deg 75deg auto",
        fov: "auto",
        sizes: [
          { name: "75мм", scale: "0.652", usdz: "dangerous_75.usdz" },
          { name: "115мм", scale: "1.0", usdz: "dangerous_115.usdz", default: true },
          { name: "200мм", scale: "1.739", usdz: "dangerous_200.usdz" }
        ],
        colors: [
          { variant: "dangerous_color_01", gradient: "linear-gradient(135deg, #2EB8EE 50%, #44D937 50%)" },
          { variant: "dangerous_color_02", gradient: "linear-gradient(135deg, #182650 50%, #FB46AF 50%)" },
          { variant: "dangerous_color_03", gradient: "linear-gradient(135deg, #38781C 50%, #BDF14F 50%)" },
          { variant: "dangerous_color_04", gradient: "linear-gradient(135deg, #FF8636 50%, #D2CD43 50%)" },
          { variant: "dangerous_color_05", gradient: "linear-gradient(135deg, #0F140C 50%, #F1F8A3 50%)" },
          { variant: "dangerous_color_06", gradient: "linear-gradient(135deg, #113109 50%, #67B42D 50%)" },
          { variant: "dangerous_color_07", gradient: "linear-gradient(135deg, #FF3619 33%, #FFFF52 33%, #FFFF52 66%, #44D937 66%)" },
          { variant: "dangerous_color_08", gradient: "linear-gradient(135deg, #520E78 0%, #520E78 100%)" },
          { variant: "dangerous_color_09", gradient: "linear-gradient(135deg, #FF392E 50%, #5C782D 50%)" },
          { variant: "dangerous_color_10", gradient: "linear-gradient(135deg, #5D4498 50%, #EB613A 50%)" }
        ]
      },
      kidcrazy: {
        glb: "kidcrazy.glb",
        defaultIos: "kidcrazy.usdz",
        defaultScale: "1 1 1",
        cameraTarget: "auto auto auto",
        orbit: "0deg 75deg auto",
        fov: "auto",
        sizes: [
          { name: "120мм", scale: "1.0", usdz: "kidcrazy.usdz", default: true }
        ],
        colors: [
          { variant: "kidcrazy_color_01", gradient: "linear-gradient(135deg, #2EB8EE 50%, #44D937 50%)" },
          { variant: "kidcrazy_color_02", gradient: "linear-gradient(135deg, #2A6040 50%, #D15110 50%)" },
          { variant: "kidcrazy_color_03", gradient: "linear-gradient(135deg, #C3DF68 50%, #B7A71D 50%)" },
          { variant: "kidcrazy_color_04", gradient: "linear-gradient(135deg, #FF8636 50%, #D2CD43 50%)" },
          { variant: "kidcrazy_color_05", gradient: "linear-gradient(135deg, #0F140C 50%, #F1F8A3 50%)" },
          { variant: "kidcrazy_color_06", gradient: "linear-gradient(135deg, #113109 50%, #67B42D 50%)" },
          { variant: "kidcrazy_color_07", gradient: "linear-gradient(135deg, #106527 50%, #C3BF44 50%)" }
        ]
      },
      valkyrie: {
        glb: "valkyrie.glb",
        defaultIos: "Valkyrie.usdz",
        defaultScale: "1 1 1",
        cameraTarget: "auto auto auto",
        orbit: "0deg 75deg auto",
        fov: "auto",
        sizes: [
          { name: "200мм", scale: "1.0", usdz: "Valkyrie.usdz", default: true }
        ],
        colors: [
          { variant: "valkyrie_color_01", gradient: "linear-gradient(135deg, #2EB8EE 42%, #FFFFFF 42%, #FFFFFF 58%, #C3EB59 58%)" },
          { variant: "valkyrie_color_02", gradient: "linear-gradient(135deg, #064E0A 33%, #FFFF52 33%, #FFFF52 66%, #FF3619 66%)" },
          { variant: "valkyrie_color_03", gradient: "linear-gradient(135deg, #2D2D2C 33%, #4CBE65 33%, #4CBE65 66%, #C6A945 66%)" },
          { variant: "valkyrie_color_04", gradient: "linear-gradient(135deg, #FF8636 50%, #D2CD43 50%)" },
          { variant: "valkyrie_color_05", gradient: "linear-gradient(135deg, #44D937 33%, #FFFF52 33%, #FFFF52 66%, #FF3619 66%)" },
          { variant: "valkyrie_color_06", gradient: "linear-gradient(135deg, #940B3C 50%, #C6A945 50%)" },
          { variant: "valkyrie_color_07", gradient: "linear-gradient(135deg, #87676D 42%, #C574BD 42%, #C574BD 58%, #C8C6D3 58%)" }
        ]
      }
    };

    let currentModelKey = 'rex';

    function applyZoom(data, forceReset = false) {
      if (forceReset) {
        viewer.setAttribute('camera-target', data.cameraTarget || 'auto auto auto');
        viewer.setAttribute('camera-orbit', data.orbit || '0deg 75deg auto');
        viewer.setAttribute('field-of-view', data.fov || 'auto');
      } else {
        if (!viewer.getAttribute('camera-target')) viewer.setAttribute('camera-target', data.cameraTarget || 'auto auto auto');
        if (!viewer.getAttribute('camera-orbit')) viewer.setAttribute('camera-orbit', data.orbit || '0deg 75deg auto');
      }

      if (viewer.jumpCameraToGoal) {
        viewer.jumpCameraToGoal();
      }
    }

    function renderUI(modelKey) {
      const data = catalogData[modelKey];
      currentModelKey = modelKey;

      viewer.src = data.glb;
      viewer.setAttribute('ios-src', data.defaultIos);
      viewer.scale = data.defaultScale;
      applyZoom(data, true);

      sizeSelector.innerHTML = '';
      data.sizes.forEach(sz => {
        const btn = document.createElement('button');
        btn.className = `size-btn ${sz.default ? 'active' : ''}`;
        btn.textContent = sz.name;
        btn.setAttribute('data-scale', sz.scale);
        btn.setAttribute('data-usdz', sz.usdz);

        btn.addEventListener('click', () => {
          document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const s = btn.getAttribute('data-scale');
          
          // Масштаб меняем без перезагрузки GLB
          viewer.scale = `${s} ${s} ${s}`;

          // iOS Quick Look
          const u = btn.getAttribute('data-usdz');
          if (u) viewer.setAttribute('ios-src', u);
          
          // Возвращаем камеру точно в центр модели
          applyZoom(data, true);
        });
        sizeSelector.appendChild(btn);
      });

      colorGrid.innerHTML = '';
      data.colors.forEach((c, index) => {
        const swatch = document.createElement('div');
        swatch.className = `color-swatch ${index === 0 ? 'active' : ''}`;
        swatch.style.background = c.gradient;
        swatch.setAttribute('data-variant', c.variant);

        swatch.addEventListener('click', () => {
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
          viewer.variantName = c.variant;
        });
        colorGrid.appendChild(swatch);
      });
    }

    modelChips.forEach(chip => {
      chip.addEventListener('click', () => {
        modelChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        const mKey = chip.getAttribute('data-model');
        renderUI(mKey);
      });
    });

    viewer.addEventListener('load', () => {
      const data = catalogData[currentModelKey];
      applyZoom(data, false);

      if (viewer.availableAnimations && viewer.availableAnimations.length > 0) {
        viewer.play({ repetitions: Infinity });
      }
      const activeColor = document.querySelector('.color-swatch.active');
      if (activeColor) {
        viewer.variantName = activeColor.getAttribute('data-variant');
      }
    });

    renderUI('rex');
  </script>
</body>
</html>
