<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BIG FISH - Каталог AR</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&display=swap" rel="stylesheet">

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    :root {
      --text-color: #ffffff;
      --chip-bg: #411070;
      --chip-text: #ffffff;
      --accent-color: #FFF200;
      --accent-contrast: #1C1B1F;

      --r-24: clamp(10px, calc(24 / 1080 * 100vw), 16px);
      --r-48: clamp(14px, calc(48 / 1080 * 100vw), 24px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      background-color: #03000b;
      background-image: 
        linear-gradient(to bottom, 
          rgba(0, 0, 0, 0.64) 0%, 
          rgba(0, 0, 0, 0.46) 12%, 
          rgba(0, 0, 0, 0.22) 24%, 
          transparent 36%, 
          transparent 55%, 
          rgba(0, 0, 0, 0.25) 65%, 
          rgba(0, 0, 0, 0.52) 78%, 
          rgba(0, 0, 0, 0.72) 88%, 
          rgba(0, 0, 0, 0.88) 100%
        ),
        linear-gradient(135deg, 
          #16003b 0%, 
          #2c006b 18%, 
          #4d00ad 38%, 
          #7600f5 58%, 
          #6200d6 78%, 
          #320078 100%
        );
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: var(--text-color);
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-variation-settings: 'wdth' 77, 'wght' 550;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Верхняя зона шапки */
    .top-header-wrapper {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, calc(30 / 1080 * 100vw), 16px);
      padding: 12px clamp(14px, calc(48 / 1080 * 100vw), 22px) 6px clamp(14px, calc(48 / 1080 * 100vw), 22px);
      z-index: 20;
      flex-shrink: 0;
      position: relative;
      background: transparent !important;
    }

    .header-top-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .brand-link:active {
      transform: scale(0.96);
    }
    .brand-logo {
      height: clamp(34px, calc(108 / 1080 * 100vw), 50px);
      width: auto;
      max-width: 50vw;
      object-fit: contain;
      display: block;
    }

    .ar-launch-btn {
      width: clamp(118px, calc(332 / 1080 * 100vw), 160px);
      height: clamp(42px, calc(118 / 1080 * 100vw), 54px);
      background: var(--accent-color);
      color: var(--accent-contrast);
      border: none;
      padding: 0 clamp(10px, calc(32 / 1080 * 100vw), 16px);
      border-radius: var(--r-24);
      font-family: inherit;
      font-variation-settings: 'wdth' 77, 'wght' 600;
      font-size: clamp(14px, calc(40 / 1080 * 100vw), 18px);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, calc(20 / 1080 * 100vw), 10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ar-launch-btn:active {
      transform: scale(0.96);
    }
    .ar-launch-btn svg {
      width: clamp(16px, calc(46 / 1080 * 100vw), 22px);
      height: clamp(16px, calc(46 / 1080 * 100vw), 22px);
      stroke-width: 2.2;
      flex-shrink: 0;
    }

    .model-nav {
      display: flex;
      gap: clamp(6px, calc(20 / 1080 * 100vw), 10px);
      width: 100%;
      justify-content: space-between;
      align-items: center;
    }

    .model-chip {
      flex: 1 1 0;
      background: var(--chip-bg);
      border: none;
      color: var(--chip-text);
      border-radius: var(--r-24);
      height: clamp(40px, calc(118 / 1080 * 100vw), 54px);
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }
    .model-chip:active {
      transform: scale(0.96);
    }
    .model-chip .chip-name {
      font-size: clamp(11px, calc(34 / 1080 * 100vw), 15px);
      font-variation-settings: 'wdth' 77, 'wght' 550;
      font-weight: 500;
      line-height: 1.1;
      white-space: nowrap;
    }
    .model-chip.active {
      background: var(--accent-color);
      color: var(--accent-contrast);
      box-shadow: 0 0 8px 1px #FFF200;
    }
    .model-chip.active .chip-name {
      font-variation-settings: 'wdth' 77, 'wght' 600;
      font-weight: 600;
    }

    /* Центральная 3D-сцена */
    .viewer-container {
      width: 100%;
      max-width: 520px;
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      background: transparent !important;
      z-index: 10;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent !important;
      background: transparent !important;
      background-color: transparent !important;
    }
    model-viewer::part(default-ar-button) {
      display: none !important;
    }

    /* Нижняя панель */
    .controls-card {
      width: 100%;
      max-width: 520px;
      flex-shrink: 0;
      margin-top: auto;
      padding: 6px clamp(14px, calc(48 / 1080 * 100vw), 22px) 16px;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, calc(30 / 1080 * 100vw), 14px);
      z-index: 20;
      position: relative;
      background: transparent !important;
    }

    .size-selector {
      display: flex;
      gap: clamp(6px, calc(20 / 1080 * 100vw), 10px);
      width: 100%;
      justify-content: center;
    }
